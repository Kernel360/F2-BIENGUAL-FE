<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오프라인</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
      }

      .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          #60a5fa 0%,
          #a855f7 46.35%,
          #ec4899 100%
        );
        color: white;
        text-align: center;
        padding: 20px;
      }

      p {
        font-size: 16px;
        line-height: 1.5;
        margin-bottom: 16px;
        white-space: pre-line;
      }

      .button {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 100%;
        background: rgba(255, 255, 255, 1);
        color: #9333ea;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 16px;
      }

      .button:hover {
        background: rgba(255, 255, 255, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p>네트워크 연결 상태가 좋지 않습니다.</p>
      <p>잠시 후 다시 시도해 주세요.</p>
      <!-- TODO(@smosco): html로 반환하니 url이 offline.html이 되어서 수정필요함 -->
      <button class="button" onclick="location.reload()">
        <svg
          data-v-14c8c335=""
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-rotate-cw lucide-icon customizable"
        >
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
          <path d="M21 3v5h-5"></path>
        </svg>
      </button>
    </div>
  </body>
</html>
